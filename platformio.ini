; ESP32 maître — projet minimal ArduinoOTA
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -I include
; extra_scripts =
;     pre:patch_espota_timeout.py

; Première installation par USB.
; Pour les téléversements OTA ultérieurs, décommenter :
upload_protocol = espota
; upload_port = espmaitre.local
upload_port = 192.168.1.7

upload_flags =
    --port=3232
    --host_port=14041
    --timeout=10
    ; Aucune bibliothèque externe nécessaire : WiFi et ArduinoOTA
; sont fournis par le framework Arduino ESP32.
